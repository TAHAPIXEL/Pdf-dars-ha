<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05080f">
<title>تابلوی قهرمانان — درس‌یار نهم</title>
<link rel="stylesheet" href="assets/css/tw.css">
<link rel="stylesheet" href="assets/css/quest.css">
</head>
<body class="bg-ink text-snow antialiased bg-fabric" style="--accent:#facc15;--accent-deep:#eab308;--accent-soft:rgba(250,204,21,.14);--accent-glow:rgba(250,204,21,.32)">
<header class="fixed top-0 inset-x-0 z-50 glass-strong">
  <div class="mx-auto max-w-7xl px-4 h-16 flex items-center gap-3">
    <a href="index.html" class="flex items-center gap-2 font-black text-lg shrink-0">
      <span class="w-9 h-9 rounded-xl grid place-items-center bg-gradient-to-br from-violet to-skyy text-ink text-base">📚</span>
      <span class="hidden sm:inline">درس‌یار</span>
    </a>
    <nav class="flex items-center gap-4 sm:gap-6 text-sm font-bold text-fog overflow-x-auto">
      <a href="index.html" class="navlink shrink-0">خانه</a>
      <a href="progress.html" class="navlink shrink-0">کارنامه</a>
      <a href="leaderboard.html" class="navlink shrink-0">قهرمانان</a>
    </nav>
    <div class="flex-1"></div>
    <div class="ub-wrap flex items-center gap-2 text-xs font-bold" data-userbar></div>
  </div>
</header>

<main class="pt-16">
  <div class="mx-auto max-w-3xl px-4 py-8 sm:py-10">
    <div class="mb-7">
      <h1 class="text-2xl sm:text-3xl font-black mb-2">تابلوی قهرمانان</h1>
      <p class="text-fog text-sm leading-7">
        کسانی که بیشترین امتیاز را گرفته‌اند. فقط نام کوتاه نمایش داده می‌شود —
        هیچ شماره یا مشخصات دیگری دیده نمی‌شود.
      </p>
    </div>

    <!-- سه سکوی برتر -->
    <div id="podium" style="display:none;display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:24px;align-items:end"></div>

    <div class="space-y-2" id="rows">
      <div class="glass rounded-2xl px-4 py-8 text-center text-sm text-fog">در حال بارگذاری…</div>
    </div>

    <p id="note" class="text-xs text-fog mt-6 text-center leading-7" style="display:none"></p>
  </div>
</main>

<script src="assets/js/config.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/cloud.js"></script>
<script>
(function () {
  const D = window.Dars;
  if (!D.requireLogin()) return;
  D.paintUserBar();

  const fa = D.fa;
  const body = document.getElementById("rows");
  const podium = document.getElementById("podium");
  const note = document.getElementById("note");

  function msg(t) {
    body.innerHTML = '<div class="glass rounded-2xl px-4 py-8 text-center text-sm text-fog">' + t + "</div>";
  }

  function paint(players) {
    body.innerHTML = "";
    if (!players.length) {
      msg("هنوز هیچ‌کس امتیازی نگرفته. اولین نفر باش!");
      return;
    }

    const MEDAL = { 1: "🥇", 2: "🥈", 3: "🥉" };
    players.forEach((p) => {
      const row = document.createElement("div");
      row.className = "glass rounded-2xl px-4 py-3 flex items-center gap-3" +
        (p.me ? " ring-1 ring-xp/50" : "");
      row.innerHTML =
        '<span class="w-8 h-8 rounded-lg grid place-items-center shrink-0 text-xs font-black ' +
          (p.rank === 1 ? "bg-gradient-to-br from-amberr to-orangey text-ink" :
           p.rank === 2 ? "bg-gradient-to-br from-slate-200 to-slate-400 text-ink" :
           p.rank === 3 ? "bg-gradient-to-br from-orangey to-amber-800 text-ink" :
           "bg-white/8 text-fog") + '">' +
          (MEDAL[p.rank] || fa(p.rank)) + '</span>' +
        '<span class="text-sm font-black flex-1 min-w-0 truncate">' + p.name +
          (p.me ? ' <span class="text-[10px] text-xp">(تو)</span>' : '') + '</span>' +
        '<span class="text-[11px] text-fog shrink-0 tabular-nums">📖 ' + fa(p.lessons) + '</span>' +
        '<span class="text-[11px] text-fog shrink-0 tabular-nums">✏️ ' + fa(p.quizzes) + '</span>' +
        '<span class="text-sm font-black text-xp shrink-0 tabular-nums">' + fa(p.xp) + '</span>';
      body.append(row);
    });

    // سکو: اول در وسط و بلندتر
    const top = players.slice(0, 3);
    if (top.length === 3) {
      const order = [top[1], top[0], top[2]];
      const medals = ["🥈", "🥇", "🥉"];
      podium.innerHTML = "";
      order.forEach((p, i) => {
        const c = document.createElement("div");
        c.className = "rounded-3xl p-4 text-center border " +
          (i === 1
            ? "border-xp/50 bg-gradient-to-b from-xp/15 to-transparent sm:py-7"
            : "border-white/10 bg-white/[0.03]");
        c.innerHTML =
          '<div class="text-3xl mb-2">' + medals[i] + "</div>" +
          '<div class="text-sm font-black mb-1 truncate">' + p.name + "</div>" +
          '<div class="text-xs text-xp font-bold">' + fa(p.xp) + " امتیاز</div>";
        podium.append(c);
      });
      podium.className = "grid grid-cols-1 sm:grid-cols-3 gap-3 mb-6 items-end";
      podium.style.display = "grid";
    }

    note.style.display = "";
    note.textContent = "این جدول از پروندهٔ همدل خوانده می‌شود و با هر درس و آزمون تازه به‌روز می‌شود.";
  }

  // اول از سرور؛ اگر نبود از همین دستگاه
  (async function load() {
    const C = window.DarsCloud;
    if (C && C.ready && C.loggedIn()) {
      try {
        const r = await C._call("leaderboard", {});
        if (r && Array.isArray(r.players)) return paint(r.players);
      } catch (e) { /* می‌رویم سراغ محلی */ }
    }
    const st = D.Store.stats();
    const xp = st.xp || 0;
    if (xp <= 0) return msg("هنوز هیچ‌کس امتیازی نگرفته. اولین نفر باش!");
    paint([{
      rank: 1,
      name: (C && C.user() && C.user().firstName) || "تو",
      xp: xp,
      lessons: Object.keys(st.lessons || {}).length,
      quizzes: Object.keys(st.quizzes || {}).length,
      me: true,
    }]);
    note.style.display = "";
    note.textContent = "اتصال به همدل برقرار نشد؛ امتیاز همین دستگاه نمایش داده می‌شود.";
  })();
})();
</script>
</body>
</html>
