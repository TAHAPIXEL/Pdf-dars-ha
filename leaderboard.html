<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05080f">
<title>تابلوی قهرمانان — درس‌یار نهم</title>
<link rel="stylesheet" href="assets/css/fonts.css">
<link rel="stylesheet" href="assets/css/app.css">
</head>
<body style="--accent:#facc15;--accent-deep:#eab308;--accent-soft:rgba(250,204,21,.14);--accent-glow:rgba(250,204,21,.32)">
<header class="topbar">
  <div class="wrap">
    <a class="back-link" href="index.html"><span class="arrow">›</span><span>صفحهٔ اصلی</span></a>
    <div class="spacer"></div>
    <div class="ub-wrap" data-userbar></div>
  </div>
</header>

<main>
  <section class="wrap section" style="padding-top:26px">
    <div class="sec-head">
      <h1 style="font-size:1.5rem">تابلوی قهرمانان</h1>
      <div class="rule"></div>
    </div>
    <p style="font-family:var(--f-ui);font-size:.86rem;color:var(--text-dim);margin:0 0 20px">
      کسانی که بیشترین امتیاز را گرفته‌اند. فقط نام کوتاه نمایش داده می‌شود —
      هیچ شماره یا مشخصات دیگری دیده نمی‌شود.
    </p>

    <!-- سه سکوی برتر -->
    <div id="podium" style="display:none;display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:24px;align-items:end"></div>

    <div class="tbl-wrap">
      <table class="teacher-table">
        <thead><tr><th>#</th><th>دانش‌آموز</th><th>امتیاز</th><th>درس</th><th>آزمون</th></tr></thead>
        <tbody id="rows">
          <tr><td colspan="5" class="lb-msg">در حال بارگذاری…</td></tr>
        </tbody>
      </table>
    </div>

    <p id="note" class="lb-note" style="display:none"></p>
  </section>
</main>

<style>
  .lb-msg { text-align: center; color: var(--text-dim); font-family: var(--f-ui); font-size: .85rem; padding: 22px 0; }
  .lb-note { font-family: var(--f-ui); font-size: .8rem; color: var(--text-dim); margin-top: 16px; text-align: center; }
  .lb-row.me td { background: rgba(250, 204, 21, .07); }
  .lb-rank {
    width: 28px; height: 28px; border-radius: 9px; display: inline-grid; place-items: center;
    font-family: var(--f-ui); font-size: .78rem; font-weight: 800;
    background: rgba(255,255,255,.06); color: var(--text-soft);
  }
  .lb-rank.g1 { background: linear-gradient(150deg,#fde68a,#f59e0b); color: #3b2503; }
  .lb-rank.g2 { background: linear-gradient(150deg,#e2e8f0,#94a3b8); color: #1e293b; }
  .lb-rank.g3 { background: linear-gradient(150deg,#fdba74,#c2410c); color: #2a1103; }
  .lb-xp { font-family: var(--f-ui); font-weight: 800; color: #fde68a; }
  .podium-card {
    border-radius: var(--r-lg); padding: 16px 12px; text-align: center;
    border: 1px solid rgba(250,204,21,.22);
    background: linear-gradient(180deg, rgba(250,204,21,.10), rgba(13,21,38,.7));
  }
  .podium-card .pc-rank { font-size: 1.6rem; line-height: 1; margin-bottom: 6px; }
  .podium-card .pc-name { font-family: var(--f-head); font-size: .92rem; margin-bottom: 3px; }
  .podium-card .pc-xp { font-family: var(--f-ui); font-size: .78rem; color: #fde68a; }
  .podium-card.first { border-color: rgba(250,204,21,.5); box-shadow: 0 18px 44px -20px rgba(250,204,21,.5); }
  @media (max-width: 560px) {
    #podium { grid-template-columns: 1fr !important; }
  }
</style>

<script src="assets/js/config.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/cloud.js"></script>
<script>
(function () {
  const D = window.Dars;
  if (!D.requireLogin()) return;
  D.paintUserBar();

  const fa = D.fa;
  const body = document.getElementById("rows");
  const podium = document.getElementById("podium");
  const note = document.getElementById("note");

  function msg(t) {
    body.innerHTML = '<tr><td colspan="5" class="lb-msg">' + t + "</td></tr>";
  }

  function paint(players) {
    body.innerHTML = "";
    if (!players.length) {
      msg("هنوز هیچ‌کس امتیازی نگرفته. اولین نفر باش!");
      return;
    }

    players.forEach((p) => {
      const tr = document.createElement("tr");
      if (p.me) tr.className = "lb-row me";
      const cls = p.rank <= 3 ? " g" + p.rank : "";
      tr.innerHTML =
        '<td><span class="lb-rank' + cls + '">' + fa(p.rank) + "</span></td>" +
        "<td>" + p.name + (p.me ? ' <span style="color:#fde68a;font-size:.72rem">(تو)</span>' : "") + "</td>" +
        '<td class="lb-xp">' + fa(p.xp) + "</td>" +
        '<td style="color:var(--text-soft)">' + fa(p.lessons) + "</td>" +
        '<td style="color:var(--text-soft)">' + fa(p.quizzes) + "</td>";
      body.append(tr);
    });

    // سکو: اول در وسط و بلندتر
    const top = players.slice(0, 3);
    if (top.length === 3) {
      const order = [top[1], top[0], top[2]];
      const medals = ["🥈", "🥇", "🥉"];
      podium.innerHTML = "";
      order.forEach((p, i) => {
        const c = document.createElement("div");
        c.className = "podium-card" + (i === 1 ? " first" : "");
        c.innerHTML =
          '<div class="pc-rank">' + medals[i] + "</div>" +
          '<div class="pc-name">' + p.name + "</div>" +
          '<div class="pc-xp">' + fa(p.xp) + " امتیاز</div>";
        podium.append(c);
      });
      podium.style.display = "grid";
    }

    note.style.display = "";
    note.textContent = "این جدول از پروندهٔ همدل خوانده می‌شود و با هر درس و آزمون تازه به‌روز می‌شود.";
  }

  // اول از سرور؛ اگر نبود از همین دستگاه
  (async function load() {
    const C = window.DarsCloud;
    if (C && C.ready && C.loggedIn()) {
      try {
        const r = await C._call("leaderboard", {});
        if (r && Array.isArray(r.players)) return paint(r.players);
      } catch (e) { /* می‌رویم سراغ محلی */ }
    }
    const st = D.Store.stats();
    const xp = st.xp || 0;
    if (xp <= 0) return msg("هنوز هیچ‌کس امتیازی نگرفته. اولین نفر باش!");
    paint([{
      rank: 1,
      name: (C && C.user() && C.user().firstName) || "تو",
      xp: xp,
      lessons: Object.keys(st.lessons || {}).length,
      quizzes: Object.keys(st.quizzes || {}).length,
      me: true,
    }]);
    note.style.display = "";
    note.textContent = "اتصال به همدل برقرار نشد؛ امتیاز همین دستگاه نمایش داده می‌شود.";
  })();
})();
</script>
</body>
</html>
