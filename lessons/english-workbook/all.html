<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05080f">
<title>همهٔ درس‌نامه‌ها — کتاب کار انگلیسی</title>
<meta name="description" content="مطالعهٔ پیوستهٔ همهٔ درس‌های کتاب کار زبان انگلیسی پایه نهم">
<link rel="stylesheet" href="../../assets/css/app.css">
</head>
<body style="--accent:#06b6d4;--accent-deep:#0891b2;--accent-soft:rgba(6,182,212,0.14);--accent-glow:rgba(6,182,212,0.35)">
<header class="topbar">
  <div class="wrap">
    <a class="back-link" href="../../index.html" data-back="../../index.html">
      <span class="arrow">›</span>
      <span>مسیر درس</span>
    </a>
    <div class="spacer"></div>
    <div class="stat-chip accent">
      <span class="ico">⚡</span>
      <span data-xp>۰</span>
      <span class="lbl">XP</span>
    </div>
    <div class="ub-wrap" data-userbar></div>
  </div>
</header>

<main>
  <section class="wrap section" style="padding-top:26px">
    <div class="sec-head">
      <h1 style="font-size:1.4rem">همهٔ درس‌نامه‌های کتاب کار انگلیسی</h1>
      <div class="rule"></div>
      <span class="hint">مطالعهٔ پیوستهٔ همهٔ درس‌ها</span>
    </div>
    <div id="allwrap"></div>
  </section>
</main>
<footer class="site-foot">
  <div class="wrap">
    <span>کتاب کار انگلیسی · کتاب کار زبان انگلیسی پایه نهم</span>
    <a href="../../index.html">صفحهٔ اصلی</a>
  </div>
</footer>

<script src="../../assets/js/config.js"></script>
<script src="../../assets/js/app.js"></script>
<script src="../../assets/js/cloud.js"></script>
<script src="../../assets/data/english-workbook.js"></script>
<script>
(function () {
  if (!Dars.requireLogin()) return;
  const { fa } = Dars;
  const C = window.CONTENT["english-workbook"];
  const host = document.getElementById("allwrap");
  const mode = Dars.Store.mode();

  C.lessons.forEach((L) => {
    const card = document.createElement("article");
    card.className = "sheet rise";
    card.style.marginBottom = "22px";
    const pts = (L.points || []).map((p) =>
      '<div class="point"><span class="n">•</span><span class="t">' + p + "</span></div>").join("");
    card.innerHTML =
      '<h2>' + L.title + '</h2>' +
      '<div style="font-family:var(--f-ui);font-size:.82rem;color:var(--text-dim);margin-bottom:16px">' +
        'درس ' + fa(L.n) + ' · صفحهٔ ' + L.page +
      '</div>' +
      (pts ? '<div class="points"><h3>نکته‌های کلیدی</h3>' + pts + "</div>" : "") +
      '<div class="fullbody">' + L.body + "</div>";
    host.append(card);
  });

  if (mode === "quick") {
    host.querySelectorAll(".fullbody").forEach((e) => (e.hidden = true));
  }
})();
</script>
</body>
</html>
