<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1117">
<title>آزمون — قرآن</title>
<meta name="description" content="آزمون آموزش قرآن پایه نهم">
<link rel="stylesheet" href="../../assets/css/app.css">
</head>
<body style="--accent:#14b8a6;--accent-deep:#0d9488;--accent-soft:rgba(20,184,166,0.14);--accent-glow:rgba(20,184,166,0.35)">
<header class="topbar">
  <div class="wrap">
    <a class="back-link" href="../../index.html" data-back="../../index.html">
      <span class="arrow">›</span>
      <span>مسیر درس</span>
    </a>
    <div class="spacer"></div>
    <div class="stat-chip accent">
      <span class="ico">⚡</span>
      <span data-xp>۰</span>
      <span class="lbl">XP</span>
    </div>
  </div>
</header>

<main>
  <section class="wrap section" style="padding-top:26px">
    <div class="quiz">
      <div class="sec-head" style="margin-bottom:18px">
        <h2 id="qtitle" style="font-size:1.2rem">آزمون</h2>
        <div class="rule"></div>
      </div>
      <div id="qz"></div>
    </div>
  </section>
</main>
<footer class="site-foot">
  <div class="wrap">
    <span>قرآن · آموزش قرآن پایه نهم</span>
    <a href="../../index.html">صفحهٔ اصلی</a>
  </div>
</footer>

<script src="../../assets/js/app.js"></script>
<script src="../../assets/data/quran.js"></script>
<script>
(function () {
  const { runQuiz } = Dars;
  const C = window.CONTENT["quran"];
  const KEY = "quran";
  const params = new URLSearchParams(location.search);

  let questions = [];
  let title = "آزمون";
  let qid = null;

  if (params.get("all") === "1") {
    // آزمون جامع: از همهٔ فصل‌ها سهم می‌گیریم
    const all = [];
    Object.keys(C.quizzes).forEach((k) => all.push(...C.quizzes[k]));
    questions = Dars.shuffle(all).slice(0, 25);
    title = "آزمون جامع قرآن";
    qid = "all";
  } else {
    const id = params.get("id") || C.lessons[0].id;
    qid = id;
    questions = C.quizzes[id] || [];
    const L = C.lessons.find(l => l.id === id);
    title = "آزمون " + (L ? L.title : "");
  }

  document.title = title + " — قرآن";
  document.getElementById("qtitle").textContent = title;

  runQuiz({
    host: document.getElementById("qz"),
    subject: KEY,
    id: qid,
    questions: questions,
    pass: 70,
    backHref: "index.html"
  });
})();
</script>
</body>
</html>
