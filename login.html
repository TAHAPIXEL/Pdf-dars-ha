<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05080f">
<title>ورود — درس‌یار نهم</title>
<link rel="stylesheet" href="assets/css/tw.css">
<link rel="stylesheet" href="assets/css/quest.css">
</head>
<body class="bg-ink text-snow antialiased bg-fabric" data-page="login">

<div class="min-h-screen flex items-center justify-center px-4 py-10 relative overflow-hidden">
  <div class="absolute inset-0 bg-grid" style="z-index:-1"></div>

  <div class="w-full max-w-md relative">
    <div class="text-center mb-8">
      <a href="index.html" class="inline-flex items-center gap-2 font-black text-2xl mb-3">
        <span class="w-12 h-12 rounded-2xl grid place-items-center bg-gradient-to-br from-violet to-skyy text-ink text-xl -rotate-6">📚</span>
        درس‌یار
      </a>
      <p class="text-fog text-sm">پایه نهم — ده کتاب، یک مسیر</p>
    </div>

    <div class="glass-strong rounded-3xl p-6 sm:p-8 shadow-2xl">
      <h1 class="text-2xl font-black mb-2">خوش برگشتی 👋</h1>
      <p class="text-fog text-sm leading-7 mb-6">
        با همان <b class="text-snow">شماره تلفن</b> و <b class="text-snow">رمز عبور</b> حساب «همدل» وارد شو.
        ثبت‌نام جداگانه لازم نیست.
      </p>

      <form id="loginForm" autocomplete="on" class="space-y-4">
        <div>
          <label for="phone" class="block text-xs font-bold text-fog mb-2">شماره تلفن</label>
          <input id="phone" name="phone" type="tel" inputmode="numeric" dir="ltr" required
                 placeholder="09xxxxxxxxx" autocomplete="username"
                 class="w-full rounded-xl bg-white/5 border border-white/15 px-4 py-3 text-snow placeholder:text-fog/50 outline-none focus:border-violet focus:ring-2 focus:ring-violet/30 transition">
        </div>
        <div>
          <label for="password" class="block text-xs font-bold text-fog mb-2">رمز عبور</label>
          <input id="password" name="password" type="password" dir="ltr" required
                 placeholder="••••" autocomplete="current-password"
                 class="w-full rounded-xl bg-white/5 border border-white/15 px-4 py-3 text-snow placeholder:text-fog/50 outline-none focus:border-violet focus:ring-2 focus:ring-violet/30 transition">
        </div>

        <button class="btn3d w-full rounded-xl px-6 py-3.5 font-black text-ink cursor-pointer"
                style="background:linear-gradient(90deg,#a78bfa,#22d3ee)" type="submit" id="go">
          ورود به درس‌یار
        </button>

        <div class="hidden rounded-xl px-4 py-3 text-sm leading-6 border border-rosee/40 bg-rosee/10 text-rosee" id="err"></div>
      </form>

      <p class="text-center text-xs text-fog mt-6">
        حساب همدل نداری؟
        <a href="https://hamdelshahed.vercel.app" target="_blank" rel="noopener"
           class="font-black text-violet hover:text-skyy transition-colors">یکی بسازید</a>
      </p>
    </div>

    <p class="text-center text-[11px] text-fog/60 mt-6 leading-6">
      محتوای همهٔ درس‌ها از کتاب‌های درسی پایه نهم ۱۴۰۵–۱۴۰۶ استخراج شده است.
    </p>
  </div>
</div>

<script src="assets/js/config.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/cloud.js"></script>
<script>
(function () {
  const form = document.getElementById("loginForm");
  const err = document.getElementById("err");
  const go = document.getElementById("go");
  const params = new URLSearchParams(location.search);
  const next = params.get("next") || "index.html";

  function fail(msg, hint) {
    err.classList.remove("hidden");
    err.textContent = msg;
    if (hint) {
      const h = document.createElement("div");
      h.className = "mt-1 opacity-80 text-xs";
      h.textContent = hint;
      err.appendChild(h);
    }
  }

  // اگر پیش‌تر وارد شده، مستقیم برود
  if (DarsCloud.loggedIn()) {
    location.replace(/^https?:/i.test(next) || next.startsWith("//") ? "index.html" : next);
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    err.hidden = true;
    go.disabled = true;
    go.textContent = "در حال ورود…";
    try {
      const user = await DarsCloud.login(
        document.getElementById("phone").value,
        document.getElementById("password").value
      );
      try { localStorage.removeItem("darsyar9:v1"); } catch (e2) {}
      // فقط مسیرهای داخلی مجازند
      const safe = /^https?:/i.test(next) || next.startsWith("//") ? "index.html" : next;
      location.replace(safe);
    } catch (ex) {
      const net = ex && (ex.network || ex.status === 0 || /Failed to fetch|NetworkError/i.test(ex.message || ""));
      if (net) {
        fail("ارتباط با سرور برقرار نشد.", "اتصال اینترنت را بررسی کنید و دوباره تلاش کنید.");
      } else if (ex.status === 429) {
        fail("تلاش‌های زیاد. یک دقیقه صبر کنید.");
      } else {
        fail(ex.message || "ورود ناموفق بود.");
      }
      go.disabled = false;
      go.textContent = "ورود به درس‌یار";
    }
  });
})();
</script>
</body>
</html>
