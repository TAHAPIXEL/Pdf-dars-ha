<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1117">
<title>کارنامهٔ من — درس‌یار نهم</title>
<link rel="stylesheet" href="assets/css/fonts.css">
<link rel="stylesheet" href="assets/css/app.css">
</head>
<body style="--accent:#6366f1;--accent-deep:#4f46e5;--accent-soft:rgba(99,102,241,.14);--accent-glow:rgba(99,102,241,.35)">
<header class="topbar">
  <div class="wrap">
    <a class="back-link" href="index.html"><span class="arrow">›</span><span>صفحهٔ اصلی</span></a>
    <div class="spacer"></div>
    <div class="ub-wrap" data-userbar></div>
  </div>
</header>

<main>
  <section class="wrap section" style="padding-top:26px">
    <div class="sec-head">
      <h1 style="font-size:1.5rem">کارنامهٔ من</h1>
      <div class="rule"></div>
    </div>
    <p style="font-family:var(--f-ui);font-size:.86rem;color:var(--text-dim);margin:0 0 20px">
      پیشرفت درس‌خواندن و نتیجهٔ آزمون‌های تو در درس‌یار — همیشه همگام با حساب همدل.
    </p>

    <div class="hero-stats" id="kpis" style="margin-bottom:24px"></div>

    <div class="sec-head"><h2 style="font-size:1.1rem">درس‌ها به تفکیک کتاب</h2><div class="rule"></div></div>
    <div id="subjects" class="progress-list"></div>

    <div class="sec-head" style="margin-top:26px"><h2 style="font-size:1.1rem">آزمون‌های اخیر</h2><div class="rule"></div></div>
    <div class="tbl-wrap">
      <table class="teacher-table">
        <thead><tr><th>کتاب</th><th>درس</th><th>نمره</th><th>حالت</th><th>زمان</th></tr></thead>
        <tbody id="recent"><tr><td colspan="5" style="text-align:center;color:var(--text-dim)">در حال بارگذاری…</td></tr></tbody>
      </table>
    </div>

    <p style="font-family:var(--f-ui);font-size:.78rem;color:var(--text-dim);margin-top:20px">
      آزمون‌ها اختیاری‌اند؛ هر زمان بخواهی می‌توانی فقط نکته‌ها را بخوانی.
      <a href="index.html" style="color:var(--accent)">بازگشت به درس‌ها</a>
    </p>
  </section>
</main>

<script src="assets/js/config.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/cloud.js"></script>
<script>
(function () {
  const D = window.Dars;
  if (!D.requireLogin()) return;
  D.paintUserBar();

  const NAME = {quran:"قرآن",payam:"پیام‌های آسمان",farsi:"فارسی",negar:"نگارش",math:"ریاضی",
                science:"علوم تجربی",social:"مطالعات اجتماعی",arabic:"عربی",english:"انگلیسی",
                "english-workbook":"کتاب کار"};
  const TOTAL = {quran:11,payam:12,farsi:17,negar:8,math:28,science:15,social:18,arabic:10,english:6,"english-workbook":6};
  const fa = (v) => String(v == null ? "۰" : v).replace(/\d/g, (d) => "۰۱۲۳۴۵۶۷۸۹"[+d]);

  function kpi(v, l) {
    const d = document.createElement("div");
    d.className = "stat-card";
    d.innerHTML = '<div class="v">' + fa(v) + '</div><div class="l">' + l + '</div>';
    return d;
  }

  function render(data) {
    const st = D.Store.stats();
    const kpis = document.getElementById("kpis");
    kpis.innerHTML = "";
    kpis.append(
      kpi(st.xp, "امتیاز XP"),
      kpi(st.streak, "روز پشت‌سرهم"),
      kpi(Object.keys(st.lessons).length, "درس خوانده"),
      kpi(Object.keys(st.quizzes).length, "آزمون داده")
    );

    const wrap = document.getElementById("subjects");
    wrap.innerHTML = "";
    const bySub = {};
    (data && data.subjects || []).forEach((r) => { bySub[r.subject] = r; });

    // اگر سرور در دسترس نبود، از وضعیت محلی همین دستگاه استفاده کن
    const localCount = {}, localQuiz = {};
    Object.keys(st.lessons).forEach((k) => {
      const s = k.split(":")[0];
      localCount[s] = (localCount[s] || 0) + 1;
    });
    Object.keys(st.quizzes).forEach((k) => {
      const s = k.split(":")[0];
      (localQuiz[s] = localQuiz[s] || []).push(st.quizzes[k].best || 0);
    });

    Object.keys(NAME).forEach((key) => {
      let r = bySub[key];
      if (!r) {
        const qs = localQuiz[key] || [];
        r = {
          lessons_read: localCount[key] || 0,
          quizzes_taken: qs.length,
          avg_pct: qs.length ? Math.round(qs.reduce((a, b) => a + b, 0) / qs.length) : null
        };
      }
      const pct = Math.min(100, Math.round((r.lessons_read / TOTAL[key]) * 100));
      const row = document.createElement("div");
      row.className = "progress-row";
      row.innerHTML =
        '<span class="pr-name">' + NAME[key] + '</span>' +
        '<div class="pr-bar"><i style="width:' + pct + '%"></i></div>' +
        '<span class="pr-num">' + fa(r.lessons_read) + "/" + fa(TOTAL[key]) + '</span>' +
        '<span class="pr-pct">' + (r.avg_pct == null ? "—" : fa(r.avg_pct) + "٪") + '</span>';
      wrap.append(row);
    });

    const recent = document.getElementById("recent");
    recent.innerHTML = "";
    // اول تلاش‌های سرور؛ اگر نبود، از تاریخچهٔ محلی همین دستگاه
    let rows = (data && data.attempts) || [];
    if (!rows.length) {
      rows = Object.keys(st.quizzes)
        .map((k) => {
          const q = st.quizzes[k];
          const [subject, lessonId] = k.split(":");
          return { subject, lesson_id: lessonId, pct: q.best, mode: "normal", created_at: q.at };
        })
        .sort((a, b) => (b.created_at || 0) - (a.created_at || 0));
    }
    if (!rows.length) {
      recent.innerHTML = '<tr><td colspan="5" style="text-align:center;color:var(--text-dim)">هنوز آزمونی نداده‌ای.</td></tr>';
    } else {
      rows.slice(0, 15).forEach((a) => {
        const tr = document.createElement("tr");
        const cls = a.pct >= 70 ? "ok" : a.pct >= 40 ? "mid" : "low";
        const when = a.created_at ? new Date(a.created_at) : null;
        tr.innerHTML =
          "<td>" + (NAME[a.subject] || a.subject) + "</td>" +
          "<td>" + fa(a.lesson_id) + "</td>" +
          '<td><span class="pill ' + cls + '">' + fa(a.pct) + "٪</span></td>" +
          "<td>" + (a.mode === "quick" ? "سریع" : "کامل") + "</td>" +
          "<td>" + (when ? when.toLocaleDateString("fa-IR") : "—") + "</td>";
        recent.append(tr);
      });
    }
  }

  render(null);
  const C = window.DarsCloud;
  if (C && C.ready && C.loggedIn()) {
    C.restore().then((d) => { if (d) render(d); }).catch(() => {});
  }
})();
</script>
</body>
</html>
