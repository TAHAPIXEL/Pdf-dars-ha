<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05080f">
<title>کتاب‌های درسی پایه نهم — درس‌یار</title>
<link rel="stylesheet" href="assets/css/tw.css">
<link rel="stylesheet" href="assets/css/quest.css">
</head>
<body class="bg-ink text-snow antialiased bg-fabric" style="--accent:#38bdf8;--accent-deep:#0284c7;--accent-soft:rgba(56,189,248,.14);--accent-glow:rgba(56,189,248,.32)">
<header class="fixed top-0 inset-x-0 z-50 glass-strong">
  <div class="mx-auto max-w-7xl px-4 h-16 flex items-center gap-3">
    <a href="index.html" class="flex items-center gap-2 font-black text-lg shrink-0">
      <span class="w-9 h-9 rounded-xl grid place-items-center bg-gradient-to-br from-violet to-skyy text-ink text-base">📚</span>
      <span class="hidden sm:inline">درس‌یار</span>
    </a>
    <nav class="flex items-center gap-4 sm:gap-6 text-sm font-bold text-fog overflow-x-auto">
      <a href="index.html" class="navlink shrink-0">خانه</a>
      <a href="progress.html" class="navlink shrink-0">کارنامه</a>
      <a href="leaderboard.html" class="navlink shrink-0">قهرمانان</a>
    </nav>
    <div class="flex-1"></div>
    <div class="ub-wrap flex items-center gap-2 text-xs font-bold" data-userbar></div>
  </div>
</header>

<main class="pt-16">
  <div class="mx-auto max-w-5xl px-4 py-8 sm:py-10">
    <div class="mb-7">
      <h1 class="text-2xl sm:text-3xl font-black mb-3">کتاب‌های درسی پایه نهم</h1>
    <p class="text-fog text-sm leading-8 mb-2">
        همهٔ محتوای درس‌یار مستقیماً از همین کتاب‌ها استخراج شده است — هیچ مطلب بیرونی،
        هیچ افزودهٔ حدسی. فایل اصل کتاب درسی برای مراجعهٔ شما اینجاست.
      </p>
      <p class="text-xs text-fog/70 mb-7">نسخهٔ ۱۴۰۵–۱۴۰۶ · برای دانلود روی هر کارت بزنید.</p>
    </div>

    <div class="grid sm:grid-cols-2 gap-3 sm:gap-4" id="books"></div>
  </div>
</main>

<script src="assets/js/config.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/cloud.js"></script>
<script>
(function () {
  const D = window.Dars;
  if (!D.requireLogin()) return;
  D.paintUserBar();

  const BOOKS = [
    { icon: "📖", name: "آموزش قرآن",        file: "01-قرآن-نهم.pdf",                 pages: 117, exam: false },
    { icon: "🕌", name: "پیام‌های آسمان",    file: "02-پیام‌های-آسمانی-نهم.pdf",      pages: 135, exam: true  },
    { icon: "📜", name: "فارسی",              file: "03-فارسی-نهم.pdf",                pages: 154, exam: true  },
    { icon: "✍️", name: "نگارش",              file: "04-نگارش-نهم.pdf",                pages: 103, exam: false },
    { icon: "📐", name: "ریاضی",              file: "05-ریاضی-نهم.pdf",                pages: 146, exam: true  },
    { icon: "🔬", name: "علوم تجربی",         file: "06-علوم-تجربی-نهم.pdf",           pages: 178, exam: true  },
    { icon: "🌍", name: "مطالعات اجتماعی",    file: "07-مطالعات-اجتماعی-نهم.pdf",      pages: 176, exam: true  },
    { icon: "🕋", name: "عربی",              file: "08-عربی-نهم.pdf",                 pages: 128, exam: false },
    { icon: "🔤", name: "زبان انگلیسی",       file: "09-زبان-انگلیسی-نهم.pdf",         pages: 122, exam: true  },
    { icon: "📝", name: "کتاب کار انگلیسی",   file: "10-کتاب-کار-زبان-انگلیسی-نهم.pdf", pages: 96, exam: false },
  ];

  const host = document.getElementById("books");
  const fa = D.fa;

  BOOKS.forEach((b) => {
    const a = document.createElement("a");
    a.className = "tilt glass rounded-3xl p-5 flex gap-4 hover:border-white/25 transition-colors";
    a.href = "پایه-نهم/" + b.file;
    a.target = "_blank";
    a.rel = "noopener";
    a.innerHTML =
      '<div class="w-12 h-12 rounded-2xl grid place-items-center text-2xl shrink-0" ' +
        'style="background:rgba(56,189,248,.12);border:1px solid rgba(56,189,248,.32)">' + b.icon + "</div>" +
      '<div class="min-w-0 flex-1">' +
        '<h3 class="font-black mb-1">' + b.name + "</h3>" +
        '<div class="flex items-center gap-3 text-[11px] text-fog flex-wrap">' +
          "<span>" + fa(b.pages) + " صفحه</span>" +
          "<span>" + (b.exam ? "✅ امتحان نهایی دارد" : "بدون امتحان نهایی") + "</span>" +
        "</div>" +
        '<div class="mt-2.5 text-[11px] font-black text-skyy">⬇ باز کردن فایل کتاب</div>' +
      "</div>";
    host.append(a);
  });
})();
</script>
</body>
</html>
