<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05080f">
<title>کتاب‌های درسی پایه نهم — درس‌یار</title>
<link rel="stylesheet" href="assets/css/fonts.css">
<link rel="stylesheet" href="assets/css/app.css">
</head>
<body style="--accent:#38bdf8;--accent-deep:#0284c7;--accent-soft:rgba(56,189,248,.14);--accent-glow:rgba(56,189,248,.32)">
<header class="topbar">
  <div class="wrap">
    <a class="back-link" href="index.html"><span class="arrow">›</span><span>صفحهٔ اصلی</span></a>
    <div class="spacer"></div>
    <div class="ub-wrap" data-userbar></div>
  </div>
</header>

<main>
  <section class="wrap section" style="padding-top:26px">
    <div class="sec-head">
      <h1 style="font-size:1.5rem">کتاب‌های درسی پایه نهم</h1>
      <div class="rule"></div>
    </div>
    <p style="font-family:var(--f-ui);font-size:.88rem;color:var(--text-dim);margin:0 0 8px;line-height:2">
      همهٔ محتوای درس‌یار مستقیماً از همین کتاب‌ها استخراج شده است — هیچ مطلب بیرونی،
      هیچ افزودهٔ حدسی. فایل اصل کتاب درسی برای مراجعهٔ شما اینجاست.
    </p>
    <p style="font-family:var(--f-ui);font-size:.8rem;color:var(--text-dim);margin:0 0 22px">
      نسخهٔ ۱۴۰۵–۱۴۰۶ · برای دانلود روی هر کارت بزنید.
    </p>

    <div class="subjects" id="books"></div>
  </section>
</main>

<style>
  .book-card {
    display: flex; gap: 14px; align-items: flex-start;
    padding: 18px 18px 16px; border-radius: var(--r-lg);
    background: rgba(13,21,38,.66);
    border: 1px solid rgba(148,163,184,.14);
    backdrop-filter: blur(14px) saturate(130%);
    -webkit-backdrop-filter: blur(14px) saturate(130%);
    text-decoration: none; color: inherit;
    transition: transform .2s cubic-bezier(.2,.8,.2,1), border-color .2s, box-shadow .2s;
  }
  .book-card:hover {
    transform: translateY(-4px);
    border-color: rgba(56,189,248,.5);
    box-shadow: 0 20px 42px -20px rgba(56,189,248,.45);
  }
  .book-ico {
    width: 48px; height: 48px; flex: none; border-radius: 15px;
    display: grid; place-items: center; font-size: 1.5rem;
    background: rgba(56,189,248,.12);
    border: 1px solid rgba(56,189,248,.32);
  }
  .book-body { min-width: 0; flex: 1; }
  .book-body h3 { margin: 0 0 3px; font-family: var(--f-head); font-size: 1rem; }
  .book-body .bm {
    font-family: var(--f-ui); font-size: .74rem; color: var(--text-dim);
    display: flex; gap: 10px; flex-wrap: wrap; margin-top: 6px;
  }
  .book-dl {
    font-family: var(--f-ui); font-size: .74rem; font-weight: 800;
    color: #7dd3fc; margin-top: 9px; display: inline-flex; gap: 4px; align-items: center;
  }
</style>

<script src="assets/js/config.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/cloud.js"></script>
<script>
(function () {
  const D = window.Dars;
  if (!D.requireLogin()) return;
  D.paintUserBar();

  const BOOKS = [
    { icon: "📖", name: "آموزش قرآن",        file: "01-قرآن-نهم.pdf",                 pages: 117, exam: false },
    { icon: "🕌", name: "پیام‌های آسمان",    file: "02-پیام‌های-آسمانی-نهم.pdf",      pages: 135, exam: true  },
    { icon: "📜", name: "فارسی",              file: "03-فارسی-نهم.pdf",                pages: 154, exam: true  },
    { icon: "✍️", name: "نگارش",              file: "04-نگارش-نهم.pdf",                pages: 103, exam: false },
    { icon: "📐", name: "ریاضی",              file: "05-ریاضی-نهم.pdf",                pages: 146, exam: true  },
    { icon: "🔬", name: "علوم تجربی",         file: "06-علوم-تجربی-نهم.pdf",           pages: 178, exam: true  },
    { icon: "🌍", name: "مطالعات اجتماعی",    file: "07-مطالعات-اجتماعی-نهم.pdf",      pages: 176, exam: true  },
    { icon: "🕋", name: "عربی",              file: "08-عربی-نهم.pdf",                 pages: 128, exam: false },
    { icon: "🔤", name: "زبان انگلیسی",       file: "09-زبان-انگلیسی-نهم.pdf",         pages: 122, exam: true  },
    { icon: "📝", name: "کتاب کار انگلیسی",   file: "10-کتاب-کار-زبان-انگلیسی-نهم.pdf", pages: 96, exam: false },
  ];

  const host = document.getElementById("books");
  const fa = D.fa;

  BOOKS.forEach((b) => {
    const a = document.createElement("a");
    a.className = "book-card";
    a.href = "پایه-نهم/" + b.file;
    a.target = "_blank";
    a.rel = "noopener";
    a.innerHTML =
      '<div class="book-ico">' + b.icon + "</div>" +
      '<div class="book-body">' +
        "<h3>" + b.name + "</h3>" +
        '<div class="bm"><span>' + fa(b.pages) + " صفحه</span>" +
          "<span>" + (b.exam ? "امتحان نهایی دارد" : "بدون امتحان نهایی") + "</span></div>" +
        '<div class="book-dl">⬇ باز کردن فایل کتاب</div>' +
      "</div>";
    host.append(a);
  });
})();
</script>
</body>
</html>
