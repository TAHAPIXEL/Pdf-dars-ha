<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05080f">
<title>وضعیت تحصیلی دانش‌آموزان — درس‌یار نهم</title>
<link rel="stylesheet" href="assets/css/tw.css">
<link rel="stylesheet" href="assets/css/quest.css">
</head>
<body class="bg-ink text-snow antialiased bg-fabric" style="--accent:#6366f1;--accent-deep:#4f46e5;--accent-soft:rgba(99,102,241,.14);--accent-glow:rgba(99,102,241,.35)">
<header class="fixed top-0 inset-x-0 z-50 glass-strong">
  <div class="mx-auto max-w-7xl px-3 sm:px-4 h-16 flex items-center gap-2">

    <a href="index.html" class="flex items-center gap-2 font-black text-base shrink-0">
      <span class="w-9 h-9 rounded-xl grid place-items-center bg-gradient-to-br from-violet to-skyy text-ink text-base shrink-0">📚</span>
      <span class="hidden xs:inline sm:inline">درس‌یار</span>
    </a>

    <!-- ناوبری دسکتاپ -->
    <nav class="hidden md:flex items-center gap-5 lg:gap-6 text-sm font-bold text-fog ms-2">
      <a href="index.html" class="navlink">خانه</a>
      <a href="progress.html" class="navlink">کارنامه</a>
      <a href="leaderboard.html" class="navlink">قهرمانان</a>
      <a href="resources.html" class="navlink">کتاب‌ها</a>
    </nav>

    <div class="flex-1 min-w-0"></div>

    <div class="ub-wrap flex items-center gap-1 sm:gap-2 text-xs font-bold shrink-0" data-userbar></div>

    <!-- دکمهٔ منو: فقط موبایل -->
    <button type="button" id="navToggle" aria-label="منو" aria-expanded="false" aria-controls="navDrawer"
            class="md:hidden w-10 h-10 shrink-0 rounded-xl grid place-items-center border border-white/15 text-snow active:scale-95 transition">
      <svg id="navIconOpen" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
        <path d="M4 7h16M4 12h16M4 17h16"/>
      </svg>
      <svg id="navIconClose" class="w-5 h-5 hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
        <path d="M6 6l12 12M18 6L6 18"/>
      </svg>
    </button>
  </div>

  <!-- کشوی موبایل -->
  <div id="navDrawer" class="md:hidden hidden border-t border-white/10 bg-abyss/95 backdrop-blur-xl">
    <nav class="px-3 py-3 grid gap-1 text-sm font-bold">
      <a href="index.html" class="nav-row">🏠 <span>خانه</span></a>
      <a href="progress.html" class="nav-row">📊 <span>کارنامهٔ من</span></a>
      <a href="leaderboard.html" class="nav-row">🏆 <span>تابلوی قهرمانان</span></a>
      <a href="resources.html" class="nav-row">📕 <span>کتاب‌های درسی</span></a>
    </nav>
  </div>
</header>

<main class="pt-16">
  <div class="mx-auto max-w-6xl px-4 py-8">
    <div class="mb-7">
      <h1 class="text-2xl sm:text-3xl font-black mb-2">وضعیت تحصیلی دانش‌آموزان</h1>
      <p class="text-fog text-sm">پیشرفت درس‌خواندن و نمرهٔ آزمون‌های درس‌یار — به‌روز از دیتابیس همدل.</p>
    </div>

    <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 mb-6" id="kpis"></div>

    <div class="tbl-wrap">
      <table class="teacher-table">
        <thead>
          <tr>
            <th>دانش‌آموز</th>
            <th>کلاس</th>
            <th>درس‌های خوانده</th>
            <th>آزمون‌ها</th>
            <th>میانگین بهترین نمره</th>
            <th>نمره (از ۲۰)</th>
            <th>آخرین فعالیت</th>
          </tr>
        </thead>
        <tbody id="rows"><tr><td colspan="8">در حال دریافت…</td></tr></tbody>
      </table>
    </div>
  </div>
</main>

<script src="assets/js/config.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/cloud.js"></script>
<script>
(function () {
  const { el, fa } = Dars;
  const body = document.getElementById("rows");
  const kpis = document.getElementById("kpis");

  if (!DarsCloud.loggedIn()) {
    location.replace("login.html?next=" + encodeURIComponent("teacher.html"));
    return;
  }
  Dars.paintUserBar();

  if (!DarsCloud.isStaff()) {
    body.innerHTML = '<tr><td colspan="8">این صفحه مخصوص دبیران و کادر مدرسه است.</td></tr>';
    return;
  }

  function cls(v) {
    if (v === null || v === undefined) return "low";
    if (v >= 75) return "ok";
    if (v >= 50) return "mid";
    return "low";
  }
  function when(iso) {
    if (!iso) return "—";
    const d = new Date(iso);
    const days = Math.floor((Date.now() - d.getTime()) / 864e5);
    if (days <= 0) return "امروز";
    if (days === 1) return "دیروز";
    if (days < 30) return fa(days) + " روز پیش";
    return d.toLocaleDateString("fa-IR");
  }

  DarsCloud._call("teacher").then(({ rows }) => {
    const list = rows || [];
    const active = list.filter(r => r.lessons_read > 0 || r.quizzes_taken > 0);
    const avg = active.length
      ? Math.round(active.reduce((s, r) => s + (r.avg_best_pct || 0), 0) / active.length)
      : 0;
    kpis.innerHTML = "";
    kpis.append(
      el("div", { class: "s" }, el("b", { text: fa(list.length) }), el("span", { text: "دانش‌آموز" })),
      el("div", { class: "s" }, el("b", { text: fa(active.length) }), el("span", { text: "فعال" })),
      el("div", { class: "s" }, el("b", { text: fa(avg) + "٪" }), el("span", { text: "میانگین نمره" })),
      el("div", { class: "s" }, el("b", { text: fa(list.reduce((s, r) => s + (r.lessons_read || 0), 0)) }), el("span", { text: "درس خوانده" }))
    );

    body.innerHTML = "";
    if (!list.length) {
      body.innerHTML = '<tr><td colspan="8">هنوز دانش‌آموزی در درس‌یار فعالیت نکرده است.</td></tr>';
      return;
    }
    list.forEach((r) => {
      const name = ((r.first_name || "") + " " + (r.last_name || "")).trim() || "دانش‌آموز";
      body.append(el("tr", {},
        el("td", { text: name }),
        el("td", { text: (r.grade ? fa(r.grade) : "—") + (r.section ? " / " + fa(r.section) : "") }),
        el("td", { text: fa(r.lessons_read || 0) }),
        el("td", { text: fa(r.quizzes_taken || 0) }),
        el("td", {}, el("span", { class: "pill " + cls(r.avg_best_pct), text: r.avg_best_pct === null ? "—" : fa(r.avg_best_pct) + "٪" })),
        el("td", {}, (() => {
          const p = r.avg_best_pct;
          if (p === null || p === undefined) return document.createTextNode("—");
          const n = Math.round((Number(p) / 100) * 20 * 10) / 10;
          const t = Number.isInteger(n) ? String(n) : n.toFixed(1);
          return el("b", { class: "tabular-nums text-sm font-black text-snow", text: fa(t) + " از ۲۰" });
        })()),
        el("td", { text: when(r.last_active) })
      ));
    });
  }).catch((e) => {
    body.innerHTML = '<tr><td colspan="8">' + (e.message || "خطا در دریافت اطلاعات") + "</td></tr>";
  });
})();
</script>
</body>
</html>
